apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chroma.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chroma.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "chroma.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chroma.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: chroma
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: IS_PERSISTENT
              value: {{ .Values.env.isPersistent | quote }}
            - name: PERSIST_DIRECTORY
              value: {{ .Values.env.persistDirectory | quote }}
            - name: ANONYMIZED_TELEMETRY
              value: {{ .Values.env.anonymizedTelemetry | quote }}
          volumeMounts:
            - name: chroma-storage
              mountPath: {{ .Values.env.persistDirectory }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: chroma-storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "chroma.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}