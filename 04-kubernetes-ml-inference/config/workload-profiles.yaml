profiles:
  small:
    description: Lightweight classifier or embedding model
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
    qos: burstable

  medium:
    description: Production inference server (recommended default)
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
    qos: guaranteed

  large:
    description: LLM or GPU-backed inference workload
    requests:
      cpu: "2"
      memory: 4Gi
      nvidia.com/gpu: 1
    limits:
      cpu: "4"
      memory: 8Gi
      nvidia.com/gpu: 1
    qos: guaranteed

rightsizing:
  cpu_headroom_multiplier: 1.3
  memory_headroom_multiplier: 1.25
  percentile: 95