apiVersion: v1
kind: ResourceQuota
metadata:
  name: inference-quota
  namespace: ml-inference
  labels:
    app.kubernetes.io/component: resource-management
spec:
  hard:
    pods: "20"
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "4"
    services: "5"
    requests.nvidia.com/gpu: "2"