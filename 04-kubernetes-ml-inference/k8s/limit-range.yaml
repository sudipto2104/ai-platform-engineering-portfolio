apiVersion: v1
kind: LimitRange
metadata:
  name: inference-limits
  namespace: ml-inference
  labels:
    app.kubernetes.io/component: resource-management
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 100m
        memory: 128Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi