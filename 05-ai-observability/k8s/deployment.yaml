apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-metrics-exporter
  namespace: ai-observability
  labels:
    app: llm-metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-metrics-exporter
  template:
    metadata:
      labels:
        app: llm-metrics-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: metrics-exporter
          image: llm-metrics-exporter:local
          imagePullPolicy: IfNotPresent
          command: ["python", "metrics_server.py", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10