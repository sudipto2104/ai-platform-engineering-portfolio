namespace: platform-assistant

image:
  repository: platform-assistant
  tag: "1.0.0"
  pullPolicy: IfNotPresent

gateway:
  port: 8080
  replicas: 2

ollama:
  baseUrl: http://ollama:11434
  model: qwen2.5:3b

chroma:
  host: chroma
  port: 8000

vault:
  addr: http://vault:8200
  secretPath: secret/data/platform-assistant
  useLocal: false

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8080