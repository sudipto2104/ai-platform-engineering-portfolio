[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-llmops"
version = "1.0.0"
description = "MLflow tracking and Kubernetes deployment for LLMOps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow>=2.18.0",
    "boto3>=1.35.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["mlflow-integration"]